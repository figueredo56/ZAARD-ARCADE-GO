<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAARD RUN - Aventura de 300 Monedas</title>
    <style>
        :root {
            --bg-dark: #070312;
            --neon-cyan: #22d3ee;
            --neon-purple: #c084fc;
            --neon-pink: #f472b6;
            --neon-green: #34d399;
            --neon-gold: #fbbf24;
            --neon-red: #fb7185;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.2), transparent 55%),
                        radial-gradient(circle at 85% 20%, rgba(192, 132, 252, 0.22), transparent 55%),
                        linear-gradient(180deg, #0b041c 0%, #05020d 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            overflow-x: hidden;
        }

        .hud-top {
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(18, 8, 38, 0.92);
            border: 1.5px solid rgba(34, 211, 238, 0.5);
            border-radius: 14px;
            padding: 10px 16px;
            box-shadow: 0 0 24px rgba(147, 51, 234, 0.35);
            margin-bottom: 10px;
        }

        .brand-title {
            font-weight: 900;
            font-size: 1.05rem;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .hud-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-weight: 800;
            font-size: 0.92rem;
        }

        .stat-pill {
            background: rgba(10, 5, 24, 0.95);
            border: 1px solid rgba(192, 132, 252, 0.45);
            padding: 5px 11px;
            border-radius: 999px;
        }

        .coins-pill {
            border-color: rgba(251, 191, 36, 0.7);
            color: var(--neon-gold);
        }

        .lives-pill {
            border-color: rgba(244, 114, 182, 0.7);
            color: var(--neon-pink);
        }

        .btn-mini {
            background: linear-gradient(135deg, #9333ea, #22d3ee);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.82rem;
            cursor: pointer;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 960px;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 38px rgba(34, 211, 238, 0.32), 0 0 24px rgba(147, 51, 234, 0.35);
            background: #090318;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(7, 3, 18, 0.88);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            z-index: 5;
        }

        .hidden {
            display: none !important;
        }

        .overlay-screen h1 {
            font-size: clamp(1.6rem, 3.8vw, 2.5rem);
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-gold), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .overlay-screen p {
            max-width: 560px;
            color: #e9d5ff;
            font-size: clamp(0.92rem, 1.5vw, 1.05rem);
            line-height: 1.55;
            margin-bottom: 18px;
        }

        .btn-main {
            background: linear-gradient(135deg, #10b981, #22d3ee);
            color: #041014;
            border: none;
            padding: 13px 26px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(34, 211, 238, 0.65);
            transition: transform 0.15s ease;
        }

        .btn-main:active {
            transform: scale(0.96);
        }

        /* Controles táctiles para móvil */
        .touch-controls {
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-top: 12px;
        }

        .move-group {
            display: flex;
            gap: 12px;
        }

        .touch-btn {
            background: rgba(24, 11, 50, 0.94);
            border: 2px solid var(--neon-purple);
            color: #fff;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            font-size: 1.5rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 16px rgba(192, 132, 252, 0.35);
            cursor: pointer;
        }

        .touch-btn:active, .touch-btn.pressed {
            background: linear-gradient(135deg, #9333ea, #22d3ee);
            border-color: var(--neon-cyan);
            transform: scale(0.94);
        }

        .jump-btn {
            width: 110px;
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 1.05rem;
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.45);
        }
    </style>
</head>
<body>

    <div class="hud-top">
        <div class="brand-title">⚡ ZAARD RUN • META 300 MONEDAS</div>
        <div class="hud-stats">
            <div class="stat-pill coins-pill">🪙 <span id="hudCoins">0</span> / 300</div>
            <div class="stat-pill lives-pill">❤️ <span id="hudLives">3</span></div>
            <div class="stat-pill" style="color:#34d399;">🐢 Pisadas: <span id="hudStomps">0</span></div>
            <button class="btn-mini" id="btnSound" onclick="toggleSound()">🔊 ON</button>
        </div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="960" height="540"></canvas>

        <!-- Inicio -->
        <div class="overlay-screen" id="startOverlay">
            <h1>⚡ ZAARD RUN ⚡</h1>
            <p>
                Camina, salta obstáculos y <strong>pisa a las tortugas por encima</strong> para eliminarlas.
                Evita tocarlas de lado o caer al vacío y junta <strong>300 monedas</strong> para ganar.
            </p>
            <button class="btn-main" onclick="startGame()">▶ INICIAR AVENTURA</button>
        </div>

        <!-- Victoria o Derrota -->
        <div class="overlay-screen hidden" id="endOverlay">
            <h1 id="endTitle">¡VICTORIA!</h1>
            <p id="endDesc">Has reunido 300 monedas.</p>
            <button class="btn-main" onclick="startGame()">🔄 JUGAR DE NUEVO</button>
        </div>
    </div>

    <div class="touch-controls">
        <div class="move-group">
            <button class="touch-btn" id="btnLeft" aria-label="Izquierda">←</button>
            <button class="touch-btn" id="btnRight" aria-label="Derecha">→</button>
        </div>
        <button class="touch-btn jump-btn" id="btnJump" aria-label="Saltar">SALTAR ↑</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GOAL_COINS = 300;
        const GROUND_Y = 450;
        const GRAVITY = 0.68;
        const JUMP_FORCE = -14.2;
        const MOVE_SPEED = 5.4;

        // Audio simple con Web Audio API
        let audioCtx = null;
        let soundOn = true;

        function ensureAudio() {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            if (!audioCtx) audioCtx = new Ctx();
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            return audioCtx;
        }

        function toggleSound() {
            soundOn = !soundOn;
            document.getElementById('btnSound').innerText = soundOn ? '🔊 ON' : '🔇 OFF';
            if (soundOn) ensureAudio();
        }

        function playTone(freq, endFreq, duration, type = 'triangle', vol = 0.14) {
            if (!soundOn) return;
            const c = ensureAudio();
            if (!c) return;
            const osc = c.createOscillator();
            const gain = c.createGain();
            const now = c.currentTime;
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.exponentialRampToValueAtTime(vol, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(now);
            osc.stop(now + duration + 0.02);
        }

        const sfxJump = () => playTone(280, 560, 0.16, 'triangle', 0.14);
        const sfxCoin = () => {
            playTone(784, 1046, 0.09, 'sine', 0.14);
            setTimeout(() => playTone(1046, 1318, 0.11, 'sine', 0.13), 75);
        };
        const sfxStomp = () => playTone(420, 140, 0.18, 'square', 0.14);
        const sfxHurt = () => playTone(200, 85, 0.28, 'sawtooth', 0.16);
        const sfxWin = () => {
            [523.25, 659.25, 783.99, 1046.5].forEach((n, i) => {
                setTimeout(() => playTone(n, n * 1.05, 0.18, 'triangle', 0.16), i * 110);
            });
        };

        // Estado del juego
        let running = false;
        let coins = 0;
        let lives = 3;
        let stomps = 0;
        let cameraX = 0;
        let nextSpawnX = 520;
        let invulnerableTimer = 0;

        const player = {
            x: 120,
            y: GROUND_Y - 46,
            w: 36,
            h: 46,
            vx: 0,
            vy: 0,
            grounded: false,
            facing: 1
        };

        const input = { left: false, right: false, jump: false };

        let platforms = [];
        let spikes = [];
        let enemies = [];
        let coinItems = [];
        let particles = [];

        function resetWorld() {
            coins = 0;
            lives = 3;
            stomps = 0;
            cameraX = 0;
            nextSpawnX = 520;
            invulnerableTimer = 0;

            player.x = 120;
            player.y = GROUND_Y - player.h;
            player.vx = 0;
            player.vy = 0;
            player.grounded = true;
            player.facing = 1;

            platforms = [];
            spikes = [];
            enemies = [];
            coinItems = [];
            particles = [];

            // Monedas iniciales para que empieces a recoger de inmediato
            for (let i = 0; i < 6; i++) {
                coinItems.push({
                    x: 240 + i * 52,
                    y: GROUND_Y - 36 - (i % 2) * 45,
                    r: 12,
                    collected: false,
                    bob: i * 0.6
                });
            }

            // Generar tramo inicial
            generateChunk(2400);
            updateHud();
        }

        function generateChunk(targetX) {
            while (nextSpawnX < targetX) {
                const chunkWidth = 360 + Math.random() * 180;
                const roll = Math.random();

                // Plataforma flotante con monedas
                if (roll < 0.65) {
                    const platW = 120 + Math.floor(Math.random() * 3) * 35;
                    const platY = GROUND_Y - (95 + Math.floor(Math.random() * 3) * 38);
                    const platX = nextSpawnX + 60;
                    platforms.push({ x: platX, y: platY, w: platW, h: 18 });

                    const numCoins = Math.max(2, Math.floor(platW / 38));
                    for (let c = 0; c < numCoins; c++) {
                        coinItems.push({
                            x: platX + 24 + c * 34,
                            y: platY - 26,
                            r: 12,
                            collected: false,
                            bob: c * 0.5
                        });
                    }
                }

                // Enemigo tipo tortuga patrullando
                if (roll >= 0.25 && roll < 0.82) {
                    const ex = nextSpawnX + 130;
                    enemies.push({
                        x: ex,
                        y: GROUND_Y - 32,
                        w: 38,
                        h: 32,
                        vx: (Math.random() < 0.5 ? -1 : 1) * (1.5 + Math.random() * 0.9),
                        minX: nextSpawnX + 30,
                        maxX: nextSpawnX + chunkWidth - 30,
                        alive: true
                    });
                } else {
                    // Obstáculo de pinchos para saltar
                    spikes.push({
                        x: nextSpawnX + 150,
                        y: GROUND_Y - 24,
                        w: 34,
                        h: 24
                    });
                }

                // Línea de monedas a ras de suelo o salto
                for (let k = 0; k < 4; k++) {
                    coinItems.push({
                        x: nextSpawnX + 40 + k * 44,
                        y: GROUND_Y - 32,
                        r: 12,
                        collected: false,
                        bob: k * 0.4
                    });
                }

                nextSpawnX += chunkWidth;
            }
        }

        function spawnParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.5 + Math.random() * 4;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.5,
                    life: 24 + Math.random() * 12,
                    color
                });
            }
        }

        function updateHud() {
            document.getElementById('hudCoins').innerText = coins;
            document.getElementById('hudLives').innerText = lives;
            document.getElementById('hudStomps').innerText = stomps;
        }

        function startGame() {
            ensureAudio();
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('endOverlay').classList.add('hidden');
            resetWorld();
            running = true;
        }

        function finishGame(won) {
            running = false;
            const overlay = document.getElementById('endOverlay');
            const title = document.getElementById('endTitle');
            const desc = document.getElementById('endDesc');

            if (won) {
                sfxWin();
                title.innerText = '🏆 ¡FELICITACIONES! 300 MONEDAS 🏆';
                desc.innerHTML = `Completaste la meta con <strong>${coins} monedas</strong> y <strong>${stomps} tortugas pisadas</strong>.`;
            } else {
                title.innerText = '💥 INTENTO FALLIDO';
                desc.innerHTML = `Juntaste <strong>${coins} / 300 monedas</strong> y pisaste <strong>${stomps} tortugas</strong>. ¡Vuelve a intentarlo!`;
            }
            overlay.classList.remove('hidden');
        }

        function loseLife() {
            if (invulnerableTimer > 0) return;
            lives--;
            invulnerableTimer = 75;
            sfxHurt();
            spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#fb7185', 14);
            updateHud();
            if (lives <= 0) {
                finishGame(false);
            }
        }

        function rectsOverlap(a, b) {
            return a.x < b.x + b.w &&
                   a.x + a.w > b.x &&
                   a.y < b.y + b.h &&
                   a.y + a.h > b.y;
        }

        function update() {
            if (!running) return;

            if (invulnerableTimer > 0) invulnerableTimer--;

            // Generar más mundo delante del jugador
            if (player.x + 1400 > nextSpawnX) {
                generateChunk(nextSpawnX + 1600);
            }

            // Movimiento horizontal
            player.vx = 0;
            if (input.left) {
                player.vx = -MOVE_SPEED;
                player.facing = -1;
            }
            if (input.right) {
                player.vx = MOVE_SPEED;
                player.facing = 1;
            }

            // Salto
            if (input.jump && player.grounded) {
                player.vy = JUMP_FORCE;
                player.grounded = false;
                input.jump = false;
                sfxJump();
            }

            const prevBottom = player.y + player.h;
            player.x += player.vx;
            if (player.x < cameraX + 20) player.x = cameraX + 20;

            player.vy += GRAVITY;
            player.y += player.vy;
            player.grounded = false;

            // Suelo principal
            if (player.y + player.h >= GROUND_Y) {
                player.y = GROUND_Y - player.h;
                player.vy = 0;
                player.grounded = true;
            }

            // Plataformas superiores (aterrizar desde arriba)
            for (const p of platforms) {
                const withinX = player.x + player.w > p.x + 4 && player.x < p.x + p.w - 4;
                if (withinX && player.vy >= 0 && prevBottom <= p.y + 8 && player.y + player.h >= p.y) {
                    player.y = p.y - player.h;
                    player.vy = 0;
                    player.grounded = true;
                }
            }

            // Cámara sigue al jugador hacia adelante
            const targetCamX = Math.max(0, player.x - canvas.width * 0.32);
            cameraX += (targetCamX - cameraX) * 0.12;

            // Recoger monedas
            for (const c of coinItems) {
                if (c.collected) continue;
                c.bob += 0.08;
                const cy = c.y + Math.sin(c.bob) * 4;
                const dx = (player.x + player.w / 2) - c.x;
                const dy = (player.y + player.h / 2) - cy;
                if (Math.hypot(dx, dy) < c.r + 22) {
                    c.collected = true;
                    coins++;
                    sfxCoin();
                    spawnParticles(c.x, cy, '#fbbf24', 8);
                    updateHud();

                    if (coins >= GOAL_COINS) {
                        finishGame(true);
                        return;
                    }
                }
            }

            // Obstáculos de pinchos
            for (const s of spikes) {
                const hitBox = { x: s.x + 5, y: s.y + 6, w: s.w - 10, h: s.h - 6 };
                if (rectsOverlap(player, hitBox)) {
                    loseLife();
                    break;
                }
            }

            // Enemigos tipo tortuga: pisar por arriba vs contacto lateral
            for (const e of enemies) {
                if (!e.alive) continue;
                e.x += e.vx;
                if (e.x <= e.minX) {
                    e.x = e.minX;
                    e.vx = Math.abs(e.vx);
                } else if (e.x + e.w >= e.maxX) {
                    e.x = e.maxX - e.w;
                    e.vx = -Math.abs(e.vx);
                }

                if (rectsOverlap(player, e)) {
                    const isStomping = player.vy > 0 && prevBottom <= e.y + e.h * 0.65;
                    if (isStomping) {
                        e.alive = false;
                        stomps++;
                        player.vy = JUMP_FORCE * 0.78;
                        player.grounded = false;
                        sfxStomp();
                        spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#34d399', 14);
                        updateHud();
                    } else {
                        loseLife();
                    }
                }
            }

            // Partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.vy += 0.16;
                pt.life--;
                if (pt.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Fondo nocturno neón
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0e0524');
            grad.addColorStop(0.7, '#19083b');
            grad.addColorStop(1, '#090316');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Estrellas de fondo con paralaje
            ctx.fillStyle = 'rgba(255,255,255,0.65)';
            for (let i = 0; i < 36; i++) {
                const sx = ((i * 173 - cameraX * 0.25) % canvas.width + canvas.width) % canvas.width;
                const sy = (i * 67) % (GROUND_Y - 60);
                ctx.fillRect(sx, sy, (i % 2) + 1.5, (i % 2) + 1.5);
            }

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Suelo
            ctx.fillStyle = '#1f0c47';
            ctx.fillRect(cameraX - 50, GROUND_Y, canvas.width + 100, canvas.height - GROUND_Y);
            ctx.fillStyle = '#22d3ee';
            ctx.fillRect(cameraX - 50, GROUND_Y, canvas.width + 100, 4);

            // Plataformas
            for (const p of platforms) {
                if (p.x + p.w < cameraX - 40 || p.x > cameraX + canvas.width + 40) continue;
                ctx.fillStyle = '#2e1065';
                ctx.strokeStyle = '#c084fc';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.w, p.h, 6);
                ctx.fill();
                ctx.stroke();
            }

            // Pinchos / obstáculos
            for (const s of spikes) {
                if (s.x + s.w < cameraX - 40 || s.x > cameraX + canvas.width + 40) continue;
                ctx.fillStyle = '#fb7185';
                ctx.beginPath();
                ctx.moveTo(s.x, s.y + s.h);
                ctx.lineTo(s.x + s.w * 0.25, s.y);
                ctx.lineTo(s.x + s.w * 0.5, s.y + s.h);
                ctx.lineTo(s.x + s.w * 0.75, s.y);
                ctx.lineTo(s.x + s.w, s.y + s.h);
                ctx.closePath();
                ctx.fill();
            }

            // Monedas
            for (const c of coinItems) {
                if (c.collected || c.x < cameraX - 30 || c.x > cameraX + canvas.width + 30) continue;
                const cy = c.y + Math.sin(c.bob) * 4;
                ctx.fillStyle = '#fbbf24';
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(c.x, cy, c.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#78350f';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', c.x, cy + 0.5);
            }

            // Enemigos tipo tortuga
            for (const e of enemies) {
                if (!e.alive || e.x + e.w < cameraX - 40 || e.x > cameraX + canvas.width + 40) continue;
                // Caparazón verde neón
                ctx.fillStyle = '#10b981';
                ctx.strokeStyle = '#6ee7b7';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(e.x + 4, e.y + 4, e.w - 8, e.h - 6, 10);
                ctx.fill();
                ctx.stroke();

                // Cabeza
                ctx.fillStyle = '#34d399';
                const headX = e.vx >= 0 ? e.x + e.w - 6 : e.x - 4;
                ctx.beginPath();
                ctx.arc(headX + 5, e.y + e.h - 11, 7, 0, Math.PI * 2);
                ctx.fill();

                // Patitas
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(e.x + 7, e.y + e.h - 5, 7, 5);
                ctx.fillRect(e.x + e.w - 14, e.y + e.h - 5, 7, 5);
            }

            // Muñeco / jugador
            if (invulnerableTimer === 0 || Math.floor(invulnerableTimer / 5) % 2 === 0) {
                // Cuerpo
                ctx.fillStyle = '#22d3ee';
                ctx.strokeStyle = '#e0f2fe';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(player.x, player.y, player.w, player.h, 8);
                ctx.fill();
                ctx.stroke();

                // Visera / ojo según dirección
                ctx.fillStyle = '#070312';
                const eyeX = player.facing >= 0 ? player.x + player.w - 12 : player.x + 6;
                ctx.fillRect(eyeX, player.y + 10, 6, 6);
            }

            // Partículas
            for (const pt of particles) {
                ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x, pt.y, 5, 5);
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Controles teclado
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                if (!e.repeat) input.jump = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
        });

        // Controles táctiles
        function bindTouch(id, onDown, onUp) {
            const el = document.getElementById(id);
            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                el.classList.add('pressed');
                onDown();
            });
            const release = () => {
                el.classList.remove('pressed');
                if (onUp) onUp();
            };
            el.addEventListener('pointerup', release);
            el.addEventListener('pointerleave', release);
            el.addEventListener('pointercancel', release);
        }

        bindTouch('btnLeft', () => { input.left = true; }, () => { input.left = false; });
        bindTouch('btnRight', () => { input.right = true; }, () => { input.right = false; });
        bindTouch('btnJump', () => { input.jump = true; }, null);

        resetWorld();
        loop();
    </script>
</body>
</html>
